<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a16"><title>森野 · 贪吃蛇</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a16;color:#edf5dd;font-family:system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #314036;padding-bottom:22px}.logo{font-weight:800;font-size:22px}.logo span{color:#bcf36d}.tag{font-size:12px;letter-spacing:3px;color:#9eafa0}.layout{display:grid;grid-template-columns:1fr 300px;gap:42px;margin-top:34px}h1{font-size:48px;letter-spacing:-2px;margin:12px 0}p{color:#a7b8a8;line-height:1.8}.eyebrow{color:#bcf36d;font-size:12px;letter-spacing:3px}.board{position:relative;background:#18271e;border:1px solid #40533f;border-radius:20px;padding:12px;box-shadow:0 22px 70px #0004}canvas{width:100%;display:block;border-radius:12px;touch-action:none}.overlay{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#101a16bd;border-radius:12px;backdrop-filter:blur(3px);text-align:center}.overlay[hidden]{display:none}.overlay h2{font-size:30px;margin:0 0 8px}.overlay p{margin:0 0 20px}button,select{font:inherit}button{border:0;border-radius:10px;padding:13px 20px;cursor:pointer;background:#bcf36d;color:#152015;font-weight:700}button:hover{filter:brightness(1.1)}button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}.secondary{background:#26372b;color:#e5eddc;border:1px solid #41503e}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.stat{padding:20px;border:1px solid #354633;border-radius:14px;background:#19261d}.stat small{color:#a7b8a8}.stat strong{display:block;font-size:36px;margin-top:7px;font-variant-numeric:tabular-nums}.card{padding:24px;border:1px solid #354633;border-radius:16px;margin-bottom:20px}label{display:block;margin-bottom:12px;color:#b6c8b0}select{width:100%;padding:12px;background:#233326;border:1px solid #44583f;color:#edf5dd;border-radius:9px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:12px 8px}h3{margin-top:0;font-size:16px}kbd{display:inline-block;padding:4px 8px;border:1px solid #4e5f48;border-bottom-width:3px;border-radius:5px;font-size:12px}.hint{font-size:12px;margin-top:16px}.controls{display:grid;grid-template-columns:repeat(3,48px);gap:6px;justify-content:center;margin-top:18px}.controls button{padding:12px;background:#293d2c;color:#edf5dd}.controls button:first-child{grid-column:2}.controls button:nth-child(2){grid-column:1}footer{margin-top:28px;display:flex;justify-content:space-between;font-size:12px;color:#839580}.dot{color:#bcf36d}@media(max-width:760px){main{padding:20px 16px}.layout{grid-template-columns:1fr;gap:22px;margin-top:24px}h1{font-size:36px}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{grid-column:1/-1;margin:0}.card{padding:16px;margin:0}.tag{letter-spacing:1px}.instructions{font-size:12px}}@media(max-width:430px){.side{display:block}.stats,.card{margin-bottom:14px}}
</style></head><body><main><header><div class="logo"><span>◈</span> 森野 SNAKE</div><div class="tag">经典游戏 · 全新节奏</div></header><div class="layout"><section><div class="eyebrow">JUST ONE MORE BITE</div><h1>慢慢来，吃掉下一颗。</h1><p>一条小蛇，一片绿野。找回简单的快乐。</p><div class="board"><canvas id="game" width="600" height="600" aria-label="贪吃蛇游戏棋盘"></canvas><div class="overlay" id="overlay"><h2 id="title">准备好出发了吗？</h2><p id="message">吃到果实得 10 分，避开墙壁和自己。</p><button id="play">开始游戏 ↗</button></div></div><div class="hint">方向键 / WASD 移动 · 空格暂停 · 手机上可滑动或点击方向按钮</div><div class="controls" aria-label="方向控制"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div></section><aside class="side"><div class="stats"><div class="stat"><small>本局得分</small><strong id="score" aria-live="polite">0</strong></div><div class="stat"><small>最高纪录</small><strong id="best">0</strong></div></div><div class="card"><label for="level">选择你的节奏</label><select id="level"><option value="180">悠闲 · 慢一点</option><option value="120" selected>经典 · 刚刚好</option><option value="75">挑战 · 快起来</option></select><p class="hint">难度将在下一局生效。</p><div class="actions"><button id="pause" class="secondary" disabled>暂停</button><button id="restart" class="secondary">重新开始</button></div></div><div class="card instructions"><h3>玩法小贴士</h3><p><span class="dot">●</span> 吃到珊瑚色果实，小蛇会长大。</p><p><span class="dot">●</span> 撞到边界或身体，本局结束。</p><p><span class="dot">●</span> 提前规划转弯，留一点余地。</p><kbd>SPACE</kbd> 暂停 / 继续</div></aside></div><footer><span>为每一个想休息片刻的人。</span><span>离线可玩 · 无需登录</span></footer></main>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),N=20,C=30;
const el=id=>document.getElementById(id);let snake,food,dir,queue,score=0,best=0,state='ready',timer,speed;
try{best=Number(localStorage.getItem('forest-snake-best'))||0}catch{}el('best').textContent=best;
const vectors={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function spawn(){const empty=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});return empty[Math.floor(Math.random()*empty.length)]}
function reset(){snake=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];dir=vectors.right;queue=[];score=0;food=spawn();el('score').textContent=0;draw()}
function draw(){ctx.fillStyle='#18271e';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#24372a';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,600);ctx.moveTo(0,i*C);ctx.lineTo(600,i*C);ctx.stroke()}if(food){ctx.fillStyle='#f29179';ctx.beginPath();ctx.arc(food.x*C+15,food.y*C+15,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d4efa1';ctx.fillRect(food.x*C+16,food.y*C+2,7,4)}snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#c6fa7c':'#87b959';ctx.beginPath();ctx.roundRect(p.x*C+2,p.y*C+2,C-4,C-4,i===0?9:6);ctx.fill();if(i===0){ctx.fillStyle='#263e22';const side=dir.x?{x:dir.x*6,y:0}:{x:0,y:dir.y*6};for(const offset of [-5,5]){ctx.beginPath();ctx.arc(p.x*C+15+side.x+(dir.y?offset:0),p.y*C+15+side.y+(dir.x?offset:0),2,0,Math.PI*2);ctx.fill()}}})}
function show(title,message,label){el('title').textContent=title;el('message').textContent=message;el('play').textContent=label;el('overlay').hidden=false}
function start(){clearInterval(timer);reset();speed=Number(el('level').value);state='running';el('overlay').hidden=true;el('pause').disabled=false;el('pause').textContent='暂停';timer=setInterval(tick,speed)}
function finish(won=false){state='over';clearInterval(timer);el('pause').disabled=true;show(won?'绿野都被你吃满啦！':'这一局，已经很棒了。','本局得分 '+score+' · 最高纪录 '+best,'再玩一局 ↗')}
function tick(){if(state!=='running')return;if(queue.length)dir=queue.shift();const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eat=head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){finish();return}snake.unshift(head);if(eat){score+=10;el('score').textContent=score;if(score>best){best=score;el('best').textContent=best;try{localStorage.setItem('forest-snake-best',String(best))}catch{}}food=spawn();if(!food){draw();finish(true);return}}else snake.pop();draw()}
function turn(name){if(state!=='running'||queue.length>=2)return;const next=vectors[name],prev=queue.length?queue[queue.length-1]:dir;if(next.x===-prev.x&&next.y===-prev.y||next.x===prev.x&&next.y===prev.y)return;queue.push(next)}
function pause(){if(state==='running'){state='paused';el('pause').textContent='继续';show('休息一下。','小蛇会在这里等你。','继续游戏 ↗')}else if(state==='paused'){state='running';el('overlay').hidden=true;el('pause').textContent='暂停'}}
el('play').onclick=()=>state==='paused'?pause():start();el('restart').onclick=start;el('pause').onclick=pause;
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(b.dataset.dir));
document.addEventListener('keydown',e=>{if(e.target.matches('select,button,input'))return;const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};const name=map[e.key]||map[e.key.toLowerCase()];if(name){e.preventDefault();turn(name)}if(e.code==='Space'){e.preventDefault();if(state==='ready'||state==='over')start();else pause()}});
let touch;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});canvas.addEventListener('pointercancel',()=>touch=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});reset();
</script></body></html>
