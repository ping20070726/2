<title>首页</title>
<style type="text/css">
	* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }
	body{
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #51CBFF);
            background-size: 400% 400%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
	.image{
		position:relative;
		
	}
	.text{
		position:relative;
		font-size: 200px;
		left: 50%;
		margin-top:-100%;
		color:rgb(0,145,255) ;
		transform: translate(-50%,-50%);
		background: linear-gradient(to right, #00ffff, #0000ff);
		-webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
		font-weight: bold;
		
	}
	.container{
		display: inline-block;
		margin: auto;
		text-align: center;
		margin: auto;
		position: absolute;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
		
		
	}
	.nav-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 50%;
            margin: 0;
            padding: 20px;
			text-align: center;
			 top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
			position: fixed;
        }
	.nav-btn {
            position: relative;
            height: 150px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
	.nav-btn:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .nav-btn i {
            font-size: 50px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        
        .nav-btn:hover i {
            transform: scale(1.2) rotate(10deg);
        }
        
        .nav-btn span {
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, 
                rgba(0, 145, 255, 0.3), 
                rgba(0, 255, 255, 0.3), 
                rgba(115, 173, 33, 0.3));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .nav-btn:hover::before {
            opacity: 1;
        }
        
        .nav-btn:nth-child(1) { background: rgba(0, 145, 255, 0.2); }
        .nav-btn:nth-child(2) { background: rgba(115, 173, 33, 0.2); }
        .nav-btn:nth-child(3) { background: rgba(255, 165, 0, 0.2); }
	 	.nav-btn:nth-child(4) { background: rgba(255, 0, 127, 0.2); }
        
        
        .nav-btn:nth-child(1):hover { background: rgba(0, 145, 255, 0.35); }
        .nav-btn:nth-child(2):hover { background: rgba(115, 173, 33, 0.35); }
        .nav-btn:nth-child(3):hover { background: rgba(255, 165, 0, 0.35); }
		.nav-btn:nth-child(4):hover { background: rgba(255, 0, 127, 0.35); }
        
	
		
	a{
		text-decoration: none;
	}
		
	</style>
</head>
